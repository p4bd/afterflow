# AfterFlow local configuration
config_version: 22
log_level: info

models:
  - name: deepseek-chat
    display_name: DeepSeek Chat
    use: langchain_openai:ChatOpenAI
    model: deepseek-chat
    base_url: https://api.deepseek.com
    api_key: $DEEPSEEK_API_KEY
    supports_thinking: false

tool_groups:
  - name: after-sales

tools:
  - name: get_after_sales_order
    group: after-sales
    use: app.after_sales.tools:get_order_context_tool
  - name: get_after_sales_payment
    group: after-sales
    use: app.after_sales.tools:get_payment_context_tool
  - name: get_logistics_evidence
    group: after-sales
    use: app.after_sales.tools:get_logistics_evidence_tool
  - name: get_customer_refund_risk
    group: after-sales
    use: app.after_sales.tools:get_customer_risk_context_tool
  - name: get_after_sales_policy
    group: after-sales
    use: app.after_sales.tools:get_policy_snapshot_tool
  - name: search_after_sales_knowledge
    group: after-sales
    use: app.after_sales.knowledge:search_after_sales_knowledge_tool
  - name: evaluate_after_sales_case
    group: after-sales
    use: app.after_sales.tools:evaluate_after_sales_case_tool
  - name: create_after_sales_case
    group: after-sales
    use: app.after_sales.tools:create_after_sales_case_tool
  - name: update_after_sales_case
    group: after-sales
    use: app.after_sales.tools:update_after_sales_case_tool
  - name: create_after_sales_action
    group: after-sales
    use: app.after_sales.tools:create_after_sales_action_tool
  - name: execute_approved_action
    group: after-sales
    use: app.after_sales.tools:execute_approved_action_tool
  - name: get_replacement_inventory
    group: after-sales
    use: app.after_sales.tools:get_replacement_inventory_tool
  - name: get_reverse_fulfillment_costs
    group: after-sales
    use: app.after_sales.tools:get_reverse_fulfillment_costs_tool
  - name: evaluate_reverse_fulfillment
    group: after-sales
    use: app.after_sales.tools:evaluate_reverse_fulfillment_tool
  - name: scan_after_sales_operations
    group: after-sales
    use: app.after_sales.tools:scan_after_sales_operations_tool

skills:
  container_path: /mnt/skills
  deferred_discovery: false

skill_scan:
  enabled: true

tool_search:
  # Defer MCP tool schemas out of the system prompt and expose them through
  # the tool_search tool instead. Off by default: the after-sales tool set is
  # small and loaded eagerly, so deferral only pays off once a deployment
  # wires in enough MCP tools that the schemas dominate the prompt.
  enabled: false
  # Schemas auto-promoted from routing metadata per model call (clamped 1..5).
  auto_promote_top_k: 3

tool_output:
  # Cap tool results before they reach the model. Anything over
  # ``externalize_min_chars`` is written to disk and replaced with a preview
  # plus a file reference; if that write is unavailable we fall back to
  # head+tail truncation at ``fallback_max_chars``. Remaining keys
  # (preview_head_chars, fallback_tail_chars, storage_subdir, ...) keep their
  # defaults -- see config/tool_output_config.py.
  enabled: true
  externalize_min_chars: 12000
  exempt_tools:
    # Exempt so persist -> read_file -> persist cannot loop.
    - read_file

agents_api:
  enabled: false

sandbox:
  use: app.sandbox:LocalSandboxProvider
  allow_host_bash: false

database:
  backend: sqlite
  sqlite_dir: .afterflow/data

scheduler:
  enabled: true
  poll_interval_seconds: 5
  lease_seconds: 120
  max_concurrent_runs: 3
  min_once_delay_seconds: 60

guardrails:
  enabled: true
  fail_closed: true
  provider:
    use: app.after_sales.guardrail:AuditedAfterSalesGuardrailProvider
    # Audit-wrapped guardrail provider. The runtime constructs this class
    # through its middleware loader; it resolves the active repository and
    # SQL-backed auditor from the initialized persistence engine. The lifespan
    # also exposes an inspectable instance on app.state. Do NOT change this to the un-audited
    # ``AfterSalesGuardrailProvider`` unless you also drop the audit
    # requirement — the audit chain is what answers the auditor's
    # "why was this refund approved?" question.
